# Render Blueprint — IoT Smart Health Monitoring System
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo to Render and it will auto-detect this file,
# or go to https://dashboard.render.com/blueprints and click "New Blueprint Instance".

services:
  # ──────────────────────────────────────────────
  # 1. Frontend — Vite React Static Site
  # ──────────────────────────────────────────────
  - type: web
    name: smart-health-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smart-health-backend.onrender.com/api

  # ──────────────────────────────────────────────
  # 2. Backend — Node.js Express API
  # ──────────────────────────────────────────────
  - type: web
    name: smart-health-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually — MongoDB Atlas connection string
      - key: FASTAPI_URL
        value: https://smart-health-ml.onrender.com  # Public Render URL of the ML web service
      - key: DEVICE_API_KEY
        sync: false  # Set manually
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a strong random value
      - key: CLIENT_ORIGIN
        value: https://smart-health-frontend.onrender.com

  # ──────────────────────────────────────────────
  # 3. ML Service — FastAPI Web Service (Free Tier)
  #    Reachable via public URL: https://smart-health-ml.onrender.com
  # ──────────────────────────────────────────────
  - type: web
    name: smart-health-ml
    plan: free
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_PATH
        value: ../ecg_risk_model.pkl  # Repo root, relative to ml-service/
      - key: VITAL_MODEL_PATH
        value: ../vital_risk_model.pkl  # Repo root, relative to ml-service/
      - key: PYTHON_VERSION
        value: "3.11"
